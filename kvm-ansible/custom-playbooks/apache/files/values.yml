---
# Apache 설치 변수 파일
# 여기서 Apache 버전, 포트, 모듈 및 설치 대상 호스트를 관리

# ============================================
# 설치 대상 호스트 (inventory.yml의 호스트명 사용)
# ============================================
apache_target_hosts:
  - ubuntu-web01  # 172.30.1.42
  # - ubuntu-web02  # 172.30.1.43

# Apache 버전 (최신 버전은 apt에서 자동으로 설치됨)
apache_version: "latest"  # Ubuntu 24.04 기본 저장소 버전

# 기본 설정
apache_http_port: 80
apache_https_port: 443
apache_document_root: /var/www/html
apache_vhost_name: "apache-gtck-kr"

# VirtualHost 설정
apache_server_name: "apache.gtck.kr"
apache_server_admin: "admin@gtck.kr"

# 비활성화 설정
apache_disable_default_site: true
apache_configure_firewall: true

# 설치할 추가 모듈 (패키지)
apache_modules:
  - libapache2-mod-php
  - libapache2-mod-security2

# 활성화할 Apache 모듈
apache_enable_mods:
  - rewrite
  - ssl
  - headers
  - proxy
  - proxy_http
