---
# Tomcat Application Server 01 생성
# root 계정에서 실행: ansible-playbook -i inventory.yml custom-playbooks/VMs/ubuntu/ubuntu-tomcat01-install.yml

- name: Create ubuntu-tomcat01 VM on KVM
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../../../group_vars/all.yml

  vars:
    vm_name: ubuntu-tomcat01
    vm_ip: 172.30.1.45
    vm_vcpus: 2
    vm_memory_mb: 4096
    vm_disk_gb: 50
    vm_description: "Tomcat Application Server 01"

  tasks:
    - name: Include VM creation tasks
      ansible.builtin.include_tasks: tasks/create-vm.yml
